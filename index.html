<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Message to your Crush on Valentine's Day</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="wrapper" class="card">
        <h2 id="question">Will you be my Val?..</h2>
        <img id="gif" alt="gif" src="https://media.giphy.com/media/FTGah7Mx3ss04PcasF/giphy.gif" />
        <div id="btn-group">
            <button id="yes-btn">Yes</button>
            <button id="no-btn">No</button>
        </div>
    </div>

    <div id="envelope-wrapper">
        <div class="envelope">
            <div class="flap"></div>
            <div class="front"></div>
            <div class="letter">
                <h3>My Dearest Baby,</h3>
                <p>Every day with you feels like a dream come true. You're my heart, my soul, and my favorite person in the world.</p>
                <p>I can't wait for our date! ❤️</p>
                <div class="signature">Forever yours, <br> [Your Name]</div>
            </div>
        </div>
    </div>

    <audio id="celebration-sound" src="https://orangefreesounds.com/wp-content/uploads/2023/02/Romantic-background-music-intro.mp3" preload="auto" loop></audio>

    <script src="./script.js"></script>
</body>
</html>
